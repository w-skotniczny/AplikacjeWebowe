        <main>
            <section id="film">

                    <div class="galeria-img">

                        <img src="img/g3.jpg" alt="góra 3" />

                    <div class="galeria-img">

                    </div>
                    <div class="galeria-img">

                    </div>
                    <div class="galeria-img">
                        <img src="img/g9.jpg" alt="góra 9" />
